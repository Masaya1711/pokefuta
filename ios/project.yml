name: PokeHuta
options:
  bundleIdPrefix: com.kmtsjym
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  PokeHuta:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: ポケふた収集
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: "近くのポケふたへのチェックインのために現在地を使用します。"
        NSLocationAlwaysAndWhenInUseUsageDescription: "設定でバックグラウンド検知をONにした場合、アプリを閉じていてもポケふたへの接近を検知してチェックインを可能にするために使用します。"
        NSCameraUsageDescription: "チェックイン写真の撮影のためにカメラを使用します。"
        NSPhotoLibraryUsageDescription: "チェックイン写真の選択のためにフォトライブラリを使用します。"
        UIBackgroundModes:
          - location
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: PokeHuta.entitlements
      properties:
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers:
          - "iCloud.com.kmtsjym.pokefuta"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kmtsjym.pokehuta
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: true
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: []
      gatherCoverageData: false
