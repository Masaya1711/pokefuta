name: PokeHuta
options:
  bundleIdPrefix: com.kmtsjym
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
  GoogleMaps:
    url: https://github.com/googlemaps/ios-maps-sdk
    from: 9.0.0

targets:
  PokeHuta:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: GoogleService-Info.plist
        buildPhase: resources
        optional: true
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
      - package: GoogleMaps
        product: GoogleMaps
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: ポケふた収集
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: "近くのポケふたへのチェックインのために現在地を使用します。"
        NSLocationAlwaysAndWhenInUseUsageDescription: "設定でバックグラウンド検知をONにした場合、アプリを閉じていてもポケふたへの接近を検知してチェックインを可能にするために使用します。"
        NSCameraUsageDescription: "チェックイン写真の撮影のためにカメラを使用します。"
        NSPhotoLibraryUsageDescription: "チェックイン写真の選択のためにフォトライブラリを使用します。"
        UIBackgroundModes:
          - location
        ITSAppUsesNonExemptEncryption: false
        GMSApiKey: "$(GOOGLE_MAPS_API_KEY)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kmtsjym.pokehuta
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: true
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    scheme:
      testTargets: []
      gatherCoverageData: false
