workflows:
  ios-testflight:
    name: PokeHuta - TestFlight配布
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: pokehuta_asc_api_key # Codemagic側で登録するApp Store Connect API Key連携の名前
    environment:
      vars:
        XCODE_PROJECT: "PokeHuta.xcodeproj"
        XCODE_SCHEME: "PokeHuta"
        APP_STORE_APPLE_ID: 6806318062
        BUNDLE_ID: com.kmtsjym.pokehuta
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project from project.yml
        script: |
          cd ios
          xcodegen generate

      - name: Use system default keychain
        script: |
          keychain initialize

      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create --certificate-key "$CERTIFICATE_PRIVATE_KEY"

      - name: Add certificates to keychain
        script: |
          keychain add-certificates

      - name: Set up automatic code signing
        script: |
          cd ios
          xcode-project use-profiles

      - name: Bump build number
        script: |
          cd ios
          agvtool new-version -all $PROJECT_BUILD_NUMBER

      - name: Build .ipa
        script: |
          cd ios
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"

    artifacts:
      - ios/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # 外部テスターグループ(Friends)は初回ビルドが1つ存在しないと作成できないため、
        # 初回ビルドではbeta_groups指定を外している。ビルド後にApp Store Connectで
        # グループを作成し、以降のビルドではここに "Friends" を追加して自動化する。
